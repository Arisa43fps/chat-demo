services:
  chat-demo:
    build: .
    image: chat-demo:latest
    container_name: chat-demo
    ports:
      - "8080:8080"
    extra_hosts:
      # Reach the host's published ports without hardcoding a LAN IP.
      - "host.docker.internal:host-gateway"
    environment:
      # Address of the 9Router gateway as seen from inside the container.
      # host.docker.internal hits the Docker host, where 9Router publishes
      # 20128; 127.0.0.1 would point at this container itself.
      ROUTER_ORIGIN: ${ROUTER_ORIGIN:-http://host.docker.internal:20128}
    restart: unless-stopped
